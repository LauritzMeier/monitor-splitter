[workspace]
members = ["driver", "app", "common"]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/monitor-splitter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }





