name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Common crate — Linux, fast ────────────────────────────────────────────
  check-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p monitor-splitter-common
      - run: cargo test  -p monitor-splitter-common

  # ─── App crate — Windows check only (no bundling) ──────────────────────────
  check-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p monitor-splitter-app

  # ─── Driver crate — Windows check only (no WDK needed) ────────────────────
  check-driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p monitor-splitter-driver
