name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Common crate (builds on all platforms) ─────────────────────────────────
  check-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p monitor-splitter-common
      - run: cargo test -p monitor-splitter-common

  # ─── Driver (Windows only, requires WDK) ───────────────────────────────────
  build-driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install WDK
        run: |
          choco install windowsdriverkit11 -y
          # Add WDK to PATH
          $wdkPath = "C:\Program Files (x86)\Windows Kits\10"
          echo "$wdkPath\bin\10.0.22621.0\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build driver
        run: |
          cargo build -p monitor-splitter-driver --release

      - name: Detect driver binary
        id: detect-driver
        shell: pwsh
        run: |
          if (Test-Path "target/release/monitor_splitter_driver.sys") {
            "has_sys=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "has_sys=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Create self-signed test certificate
        if: steps.detect-driver.outputs.has_sys == 'true'
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Monitor Splitter Test" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(3)
          $thumbprint = $cert.Thumbprint
          echo "CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

      - name: Sign driver
        if: steps.detect-driver.outputs.has_sys == 'true'
        run: |
          $inf = "driver/MonitorSplitter.inf"
          # Sign the .sys file
          signtool sign /v /s My /n "Monitor Splitter Test" /t http://timestamp.digicert.com `
            target/release/monitor_splitter_driver.sys
          # Generate .cat file
          inf2cat /driver:target/release /os:10_X64
          signtool sign /v /s My /n "Monitor Splitter Test" /t http://timestamp.digicert.com `
            target/release/monitor_splitter_driver.cat

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: driver-bundle
          path: |
            target/release/monitor_splitter_driver.sys
            driver/MonitorSplitter.inf
            target/release/*.cat
          if-no-files-found: warn

  # ─── App (builds on Windows for releases) ──────────────────────────────────
  build-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        run: |
          cargo install tauri-cli --version "^2.0"
          cd app
          cargo tauri build

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: |
            target/release/bundle/

  # ─── Installer ─────────────────────────────────────────────────────────────
  build-installer:
    runs-on: windows-latest
    needs: [build-driver, build-app]
    steps:
      - uses: actions/checkout@v4

      - name: Download driver bundle
        uses: actions/download-artifact@v4
        with:
          name: driver-bundle
          path: installer/driver/

      - name: Download app bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: installer/app/

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (!(Test-Path "$nsisDir\makensis.exe")) { throw "makensis.exe not found at $nsisDir" }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          where.exe makensis

      - name: Build installer
        shell: pwsh
        run: |
          $hasDriver = (Test-Path "installer/driver/monitor_splitter_driver.sys") -and (Test-Path "installer/driver/MonitorSplitter.cat")
          Push-Location installer
          if ($hasDriver) {
            & makensis installer.nsi
          } else {
            & makensis /DSKIP_DRIVER installer.nsi
          }
          Pop-Location

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MonitorSplitter-Setup
          path: installer/MonitorSplitter-Setup.exe

  # ─── Release ───────────────────────────────────────────────────────────────
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build-installer]
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: MonitorSplitter-Setup

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: MonitorSplitter-Setup.exe



