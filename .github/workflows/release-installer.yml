name: Build Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (!(Test-Path "$nsisDir\makensis.exe")) {
            throw "makensis.exe not found at $nsisDir"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build app
        run: cargo build -p monitor-splitter-app --release --bin monitor-splitter

      - name: Stage installer inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/app | Out-Null
          New-Item -ItemType Directory -Force -Path installer/driver | Out-Null
          Copy-Item target/release/monitor-splitter.exe installer/app/monitor-splitter.exe -Force

          if (Test-Path driver/monitor_splitter_driver.sys) {
            Copy-Item driver/monitor_splitter_driver.sys installer/driver/monitor_splitter_driver.sys -Force
          }
          if (Test-Path driver/MonitorSplitter.inf) {
            Copy-Item driver/MonitorSplitter.inf installer/driver/MonitorSplitter.inf -Force
          }
          if (Test-Path driver/MonitorSplitter.cat) {
            Copy-Item driver/MonitorSplitter.cat installer/driver/MonitorSplitter.cat -Force
          }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $hasDriver = (Test-Path installer/driver/monitor_splitter_driver.sys) -and (Test-Path installer/driver/MonitorSplitter.cat)
          where.exe makensis
          Push-Location installer
          if ($hasDriver) {
            & makensis installer.nsi
          } else {
            & makensis /DSKIP_DRIVER installer.nsi
          }
          Pop-Location

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorSplitter-Setup
          path: installer/MonitorSplitter-Setup.exe

      - name: Publish release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag installer/MonitorSplitter-Setup.exe --clobber





